name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check auth invariant
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/harris-wonderland-dev.log"

          cleanup() {
            if [[ -n "${dev_pid:-}" ]]; then
              kill "$dev_pid" 2>/dev/null || true
              wait "$dev_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npm run dev >"$log_file" 2>&1 &
          dev_pid=$!

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/__app-env >/dev/null; then
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent --show-error http://127.0.0.1:8080/__app-env >/dev/null; then
            cat "$log_file"
            exit 1
          fi

          npm run check:auth -- --dev-url http://127.0.0.1:8080

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
